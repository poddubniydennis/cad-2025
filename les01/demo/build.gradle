plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Подключаем Spring Context (основной пакет IoC)
    implementation 'org.springframework:spring-context:6.1.4'

    // Для тестов (если понадобятся)
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'com.example.app.Main'
}

test {
    useJUnitPlatform()
}
sourceSets {
    main {
        java {
            srcDirs = ['manual/src']
        }
    }
}